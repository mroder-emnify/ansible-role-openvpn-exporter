---
- import_tasks: preflight.yml
  tags:
    - openvpn_exporter_install
    - openvpn_exporter

- import_tasks: install.yml
  become: True
  tags:
    - openvpn_exporter_install
    - openvpn_exporter

- name: Ensure openvpn_exporter service is started and enabled
  become: True
  systemd:
    daemon_reload: True
    name: openvpn_exporter
    state: started
    enabled: True
  register: openvpn_exporter_service
  # In check mode on a fresh host the unit file is not written yet.
  failed_when:
    - openvpn_exporter_service is failed
    - not (ansible_check_mode and 'Could not find the requested service' in openvpn_exporter_service.msg | default(''))
  tags:
    - openvpn_exporter_run
    - openvpn_exporter
